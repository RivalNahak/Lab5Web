<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Nilai Mahasiswa</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 30px auto; padding: 0 16px; }
    label { display: block; margin-top: 10px; }
    input { width: 100%; padding: 6px; box-sizing: border-box; }
    button { margin-top: 14px; padding: 8px 16px; }
    #hasil { margin-top: 16px; padding: 10px; background: #f4f4f4; }
    .error { color: #c00; }
  </style>
</head>
<body>
  <h1>Kalkulator Nilai Mahasiswa</h1>
  <label for="tugas">Nilai Tugas (30%)</label>
  <input type="number" id="tugas" min="0" max="100">
  <label for="uts">Nilai UTS (30%)</label>
  <input type="number" id="uts" min="0" max="100">
  <label for="uas">Nilai UAS (40%)</label>
  <input type="number" id="uas" min="0" max="100">
  <button type="button" onclick="proses()">Hitung</button>
  <div id="hasil">Hasil akan tampil di sini.</div>
  <p><a href="index.html">← Kembali</a></p>
  <script src="kalkulator.js"></script>
</body>
</html>
